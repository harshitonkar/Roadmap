<title>Track 1 → Track 2 — AI/ML Master Roadmap</title>

<style>
  :root{
    --bg:#12141a;
    --surface:#181b23;
    --surface2:#1f232d;
    --border:rgba(255,255,255,0.08);
    --border-strong:rgba(255,255,255,0.16);
    --text:#e9e7e0;
    --muted:#8b909e;
    --dim:#5c6170;
    --t1:#e8934a;
    --t1-dim:rgba(232,147,74,0.14);
    --t2:#57b6c2;
    --t2-dim:rgba(87,182,194,0.14);
    --t3:#a684e8;
    --t3-dim:rgba(166,132,232,0.14);
    --done:#7fc26a;
    --done-dim:rgba(127,194,106,0.14);
    --hot:#e85a5a;
    --mono:'JetBrains Mono', monospace;
    --sans:'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    padding-bottom:64px;
  }
  ::selection{background:var(--t1-dim);}

  header{
    padding:28px 18px 20px;
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg, #161922 0%, var(--bg) 100%);
    position:sticky; top:0; z-index:20;
  }
  .eyebrow{
    font-family:var(--mono); font-size:11px; letter-spacing:0.14em;
    color:var(--dim); text-transform:uppercase; margin-bottom:8px;
    display:flex; align-items:center; gap:8px;
  }
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--done);box-shadow:0 0 6px var(--done);}
  h1{font-family:var(--mono); font-size:21px; font-weight:700; margin:0 0 4px; letter-spacing:-0.01em;}
  h1 .arrow{color:var(--dim); font-weight:400; margin:0 4px;}
  h1 .t1{color:var(--t1);}
  h1 .t2{color:var(--t2);}
  .sub{color:var(--muted); font-size:13px; margin:0 0 18px; line-height:1.5;}

  .head-ref{
    font-family:var(--mono); font-size:11.5px; color:var(--dim);
    background:var(--surface); border:1px solid var(--border);
    border-radius:6px; padding:8px 10px; margin-bottom:16px;
    display:flex; align-items:center; gap:8px; overflow:hidden;
  }
  .head-ref b{color:var(--text); font-weight:600;}
  .head-ref .cursor{width:6px;height:12px;background:var(--done);display:inline-block;animation:blink 1.1s steps(2) infinite; flex-shrink:0;}
  @keyframes blink{50%{opacity:0;}}
  .head-ref .path{color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  .progress-overall{margin-bottom:4px;}
  .progress-row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;}
  .progress-label{font-family:var(--mono); font-size:11px; color:var(--muted); letter-spacing:0.05em;}
  .progress-pct{font-family:var(--mono); font-size:15px; font-weight:700; color:var(--text);}
  .bar-track{height:6px; background:var(--surface2); border-radius:3px; overflow:hidden; border:1px solid var(--border);}
  .bar-fill{height:100%; background:linear-gradient(90deg,var(--t1),var(--done)); border-radius:3px; transition:width .35s ease;}

  .track-legend{display:flex; gap:14px; margin-top:14px; flex-wrap:wrap;}
  .legend-item{display:flex; align-items:center; gap:5px; font-family:var(--mono); font-size:10.5px; color:var(--muted);}
  .legend-dot{width:8px;height:8px;border-radius:50%;}

  .filter-row{display:flex; gap:6px; margin-top:14px;}
  .filter-btn{
    font-family:var(--mono); font-size:11px; color:var(--muted);
    border:1px solid var(--border); padding:6px 10px; border-radius:6px;
    background:var(--surface); cursor:pointer; flex:1; text-align:center;
  }
  .filter-btn.active{background:var(--surface2); color:var(--text); border-color:var(--border-strong);}

  .track-banner{margin:28px 18px 12px; padding:14px; border-radius:8px; border:1px solid var(--border); position:relative;}
  .track-banner.t1{border-color:rgba(232,147,74,0.35); background:var(--t1-dim);}
  .track-banner.t2{border-color:rgba(87,182,194,0.35); background:var(--t2-dim);}
  .track-banner.t3{border-color:rgba(166,132,232,0.35); background:var(--t3-dim);}
  .track-banner h2{font-family:var(--mono); font-size:14px; margin:0; letter-spacing:0.02em;}
  .track-banner.t1 h2{color:var(--t1);}
  .track-banner.t2 h2{color:var(--t2);}
  .track-banner.t3 h2{color:var(--t3);}
  .track-banner p{margin:4px 0 0; font-size:12.5px; color:var(--muted); line-height:1.5;}

  .graph{margin:0 18px; position:relative; padding-left:22px;}
  .graph::before{content:''; position:absolute; left:9px; top:6px; bottom:6px; width:2px; background:linear-gradient(180deg, var(--border-strong), var(--border));}
  .phase{position:relative; margin-bottom:10px; border:1px solid var(--border); border-radius:8px; background:var(--surface); overflow:hidden;}
  .phase[hidden]{display:none;}
  .phase::before{content:''; position:absolute; left:-22px; top:20px; width:11px; height:11px; border-radius:50%; background:var(--bg); border:2px solid var(--dim); z-index:2;}
  .phase.t1::before{border-color:var(--t1);}
  .phase.t2::before{border-color:var(--t2);}
  .phase.t3::before{border-color:var(--t3);}
  .phase.complete::before{background:var(--done); border-color:var(--done); box-shadow:0 0 8px rgba(127,194,106,0.6);}

  .phase-head{display:flex; align-items:center; gap:10px; padding:13px 14px; cursor:pointer; user-select:none;}
  .phase-num{font-family:var(--mono); font-size:11px; font-weight:700; color:var(--bg); background:var(--dim); border-radius:4px; padding:2px 6px; flex-shrink:0;}
  .phase.t1 .phase-num{background:var(--t1); color:#1a1200;}
  .phase.t2 .phase-num{background:var(--t2); color:#001417;}
  .phase.t3 .phase-num{background:var(--t3); color:#160a2e;}
  .phase.complete .phase-num{background:var(--done); color:#0c1a08;}
  .phase-title{font-family:var(--sans); font-weight:600; font-size:13.5px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .phase-frac{font-family:var(--mono); font-size:11px; color:var(--muted); flex-shrink:0;}
  .chev{width:16px; height:16px; flex-shrink:0; color:var(--dim); transition:transform .2s ease;}
  .phase.open .chev{transform:rotate(90deg);}

  .phase-mini-bar{height:3px; background:var(--surface2);}
  .phase-mini-fill{height:100%; background:var(--dim);}
  .phase.t1 .phase-mini-fill{background:var(--t1);}
  .phase.t2 .phase-mini-fill{background:var(--t2);}
  .phase.t3 .phase-mini-fill{background:var(--t3);}
  .phase.complete .phase-mini-fill{background:var(--done);}

  .phase-body{max-height:0; overflow:hidden; transition:max-height .3s ease;}
  .phase.open .phase-body{max-height:none;}
  .phase-body-inner{padding:4px 14px 14px 14px;}

  .group-label{font-family:var(--mono); font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--dim); margin:12px 0 6px; line-height:1.5;}
  .group-label:first-child{margin-top:2px;}

  .topic{display:flex; align-items:flex-start; gap:9px; padding:6px 4px; border-radius:5px; cursor:pointer;}
  .topic[hidden]{display:none;}
  .topic:active{background:var(--surface2);}
  .box{width:16px; height:16px; flex-shrink:0; margin-top:1px; border-radius:4px; border:1.5px solid var(--border-strong); display:flex; align-items:center; justify-content:center; transition:all .15s ease;}
  .topic.checked .box{background:var(--done); border-color:var(--done);}
  .box svg{width:10px; height:10px; opacity:0; transition:opacity .1s ease;}
  .topic.checked .box svg{opacity:1;}
  .topic-text{font-size:13px; line-height:1.4; color:var(--text);}
  .topic.checked .topic-text{color:var(--dim); text-decoration:line-through; text-decoration-color:var(--border-strong);}
  .hot-mark{color:var(--hot); font-size:10px; margin-left:4px; vertical-align:1px;}

  .project-card{border:1px solid var(--border); border-radius:6px; padding:10px 11px; margin:8px 0; background:var(--surface2);}
  .project-card .pc-head{display:flex; align-items:flex-start; gap:9px; cursor:pointer;}
  .project-card .pc-title{font-weight:600; font-size:13px; margin-bottom:3px;}
  .project-card.checked .pc-title{color:var(--dim); text-decoration:line-through;}
  .pipeline{font-family:var(--mono); font-size:11px; color:var(--muted); line-height:1.6; margin-left:25px;}

  .info-card{margin:0 18px 12px; padding:16px; border:1px solid var(--border); border-radius:8px; background:var(--surface);}
  .info-card h3{font-family:var(--mono); font-size:13px; margin:0 0 10px; color:var(--text); letter-spacing:0.02em;}
  .info-card h3 .tag{color:var(--dim); font-weight:400;}
  .stack-row{margin-bottom:9px;}
  .stack-row .k{font-family:var(--mono); font-size:10.5px; color:var(--dim); text-transform:uppercase; letter-spacing:0.06em; display:block; margin-bottom:3px;}
  .stack-row .v{font-size:12.5px; color:var(--muted); line-height:1.6;}
  .milestone{display:flex; gap:10px; padding:9px 0; border-top:1px solid var(--border);}
  .milestone:first-of-type{border-top:none;}
  .milestone .mk{font-family:var(--mono); font-size:11px; color:var(--t2); flex-shrink:0; width:92px; padding-top:1px;}
  .milestone .mv{font-size:12.5px; color:var(--text); line-height:1.5;}
  .milestone .mv b{color:var(--t1);}

  footer{margin:32px 18px 0; padding:16px 0 0; border-top:1px solid var(--border); font-family:var(--mono); font-size:11px; color:var(--dim); display:flex; justify-content:space-between; align-items:center;}
  .reset-btn{font-family:var(--mono); font-size:11px; color:var(--muted); background:var(--surface); border:1px solid var(--border); border-radius:5px; padding:6px 10px; cursor:pointer;}
  .reset-btn:active{background:var(--surface2);}

  .loading{padding:40px; text-align:center; color:var(--dim); font-family:var(--mono); font-size:12px;}
</style>
</head>

const STORAGE_KEY = 'progress-v2';

/* ---------- Cross-device sync via Supabase (optional) ----------
   1. Create a free project at supabase.com
   2. Run the SQL from supabase-setup.sql in the SQL Editor
   3. Paste your Project URL + anon public key below
   4. On each device, open the page once and enter the same "sync code"
      (any passphrase you choose) — that links all devices to one record.
   Leave both blank to just use this browser's local storage instead. */
const SUPABASE_URL = 'https://wihnalmrjxogjhtlpclm.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndpaG5hbG1yanhvZ2podGxwY2xtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0NzkwMTgsImV4cCI6MjEwMzA1NTAxOH0.q_saXS2MdD8cA1Bul1GtmL21TTVGoxlXtYGekiGpl8k';
const SYNC_ENABLED = !!(SUPABASE_URL && SUPABASE_ANON_KEY);

let progress = {};
let firstRun = false;
let activeFilter = 'all';
let syncCode = null;

function loadSyncCode(){
  syncCode = localStorage.getItem('roadmap-sync-code') || null;
}
function promptForSyncCode(existing){
  const msg = existing
    ? "Change sync code (use this to link a new device to your data), or press Cancel to keep the current one:"
    : "Pick a sync code — any word or phrase. Enter the SAME code on every device to keep progress in sync:";
  const code = prompt(msg, existing || '');
  if(code && code.trim()){
    syncCode = code.trim();
    localStorage.setItem('roadmap-sync-code', syncCode);
    return true;
  }
  return false;
}

async function supabaseFetch(path, options={}){
  const res = await fetch(SUPABASE_URL.replace(/\/$/,'') + '/rest/v1/' + path, {
    ...options,
    headers: {
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
      'Content-Type': 'application/json',
      ...(options.headers||{})
    }
  });
  if(!res.ok) throw new Error('supabase request failed: ' + res.status);
  return res;
}
async function pullRemote(code){
  const res = await supabaseFetch(`roadmap_progress?sync_code=eq.${encodeURIComponent(code)}&select=data`);
  const rows = await res.json();
  return rows.length ? rows[0].data : null;
}
async function pushRemote(code, data){
  await supabaseFetch('roadmap_progress', {
    method:'POST',
    headers:{ 'Prefer':'resolution=merge-duplicates' },
    body: JSON.stringify({sync_code: code, data, updated_at: new Date().toISOString()})
  });
}

function parseItem(raw){
  const hot = raw.includes('🔥');
  return {text: raw, done: false, hot};
}

function allTopicIds(){
  const ids = [];
  DATA.forEach(section=>{
    if(!section.id) return;
    (section.groups||[]).forEach((g,gi)=>{
      g.items.forEach((t,ti)=> ids.push(section.id+'-g'+gi+'-t'+ti));
    });
    (section.projects||[]).forEach((p,pi)=> ids.push(section.id+'-proj'+pi));
  });
  return ids;
}

function defaultDoneIds(){
  const ids = [];
  DATA.forEach(section=>{
    if(!section.id) return;
    (section.groups||[]).forEach((g,gi)=>{
      g.items.forEach((t,ti)=>{
        if(parseItem(t).done) ids.push(section.id+'-g'+gi+'-t'+ti);
      });
    });
  });
  return ids;
}

function phaseStats(section){
  let total=0, done=0;
  (section.groups||[]).forEach((g,gi)=>{
    g.items.forEach((t,ti)=>{ total++; if(progress[section.id+'-g'+gi+'-t'+ti]) done++; });
  });
  (section.projects||[]).forEach((p,pi)=>{ total++; if(progress[section.id+'-proj'+pi]) done++; });
  return {total, done};
}

function currentPhaseLabel(){
  for(const section of DATA){
    if(!section.id) continue;
    const {total,done} = phaseStats(section);
    if(done < total){
      const trackName = section.track===1 ? 'track1' : section.track===2 ? 'track2' : 'ongoing';
      return trackName + '/s' + section.num + '-' + section.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
    }
  }
  return 'main — all phases complete 🎉';
}

function checkSvg(){ return '<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.2 11.5L13 4.5" stroke="#0c1a08" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }
function chevSvg(){ return '<svg viewBox="0 0 16 16" fill="none"><path d="M6 3L11 8L6 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'; }

const openState = {};
const trackClassMap = {1:'t1',2:'t2',3:'t3'};

function render(){
  const app = document.getElementById('app');
  let html = '<div class="graph">';
  DATA.forEach(section=>{
    if(!section.id){
      html += `<div class="track-banner ${trackClassMap[section.track]}">
        <h2>${section.banner}</h2>
        <p>${section.bannerDesc}</p>
      </div>`;
      return;
    }
    const {total, done} = phaseStats(section);
    const complete = total>0 && done===total;
    const pct = total ? Math.round(done/total*100) : 0;
    const open = !!openState[section.id];
    const trackClass = trackClassMap[section.track];

    let hasVisibleContent = true;
    if(activeFilter==='remaining' && complete && !section.capstone) hasVisibleContent = false;

    html += `<div class="phase ${trackClass} ${complete?'complete':''} ${open?'open':''}" data-phase="${section.id}" ${hasVisibleContent?'':'hidden'}>
      <div class="phase-head" data-toggle="${section.id}">
        <span class="phase-num">${section.capstone ? '★' : section.num}</span>
        <span class="phase-title">${section.title}</span>
        <span class="phase-frac">${done}/${total}</span>
        <span class="chev">${chevSvg()}</span>
      </div>
      <div class="phase-mini-bar"><div class="phase-mini-fill" style="width:${pct}%"></div></div>
      <div class="phase-body"><div class="phase-body-inner">`;

    (section.groups||[]).forEach((g,gi)=>{
      let groupHasVisible = false;
      let groupHtml = `<div class="group-label">${g.label}</div>`;
      g.items.forEach((raw,ti)=>{
        const {text, hot} = parseItem(raw);
        const tid = section.id+'-g'+gi+'-t'+ti;
        const checked = !!progress[tid];
        let itemHidden = false;
        if(activeFilter==='remaining' && checked) itemHidden = true;
        if(activeFilter==='hot' && !hot) itemHidden = true;
        if(!itemHidden) groupHasVisible = true;
        groupHtml += `<div class="topic ${checked?'checked':''}" data-topic="${tid}" ${itemHidden?'hidden':''}>
          <span class="box">${checkSvg()}</span>
          <span class="topic-text">${text}</span>
        </div>`;
      });
      if(groupHasVisible) html += groupHtml;
    });

    (section.projects||[]).forEach((p,pi)=>{
      const tid = section.id+'-proj'+pi;
      const checked = !!progress[tid];
      let itemHidden = false;
      if(activeFilter==='remaining' && checked) itemHidden = true;
      if(activeFilter==='hot') itemHidden = true;
      html += `<div class="project-card ${checked?'checked':''}" data-topic="${tid}" ${itemHidden?'hidden':''}>
        <div class="pc-head">
          <span class="box">${checkSvg()}</span>
          <div><div class="pc-title">${p.name}</div></div>
        </div>
        <div class="pipeline">${p.pipeline}</div>
      </div>`;
    });

    html += `</div></div></div>`;
  });
  html += '</div>';

  if(activeFilter==='all'){
    INFO_SECTIONS.forEach(info=>{
      html += `<div class="info-card"><h3>${info.title} <span class="tag">— ${info.tag}</span></h3>`;
      if(info.rows){
        info.rows.forEach(r=>{ html += `<div class="stack-row"><span class="k">${r.k}</span><span class="v">${r.v}</span></div>`; });
      }
      if(info.milestones){
        info.milestones.forEach(m=>{ html += `<div class="milestone"><span class="mk">${m.k}</span><span class="mv">${m.v}</span></div>`; });
      }
      html += `</div>`;
    });
  }

  app.innerHTML = html;

  document.querySelectorAll('[data-toggle]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-toggle');
      openState[id] = !openState[id];
      render();
    });
  });
  document.querySelectorAll('[data-topic]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const id = el.getAttribute('data-topic');
      progress[id] = !progress[id];
      save();
      render();
      updateHeader();
    });
  });

  updateHeader();
}

function updateHeader(){
  const ids = allTopicIds();
  const doneCount = ids.filter(id=>progress[id]).length;
  const pct = ids.length ? Math.round(doneCount/ids.length*100) : 0;
  document.getElementById('overall-pct').textContent = pct+'%';
  document.getElementById('overall-bar').style.width = pct+'%';
  document.getElementById('footer-count').textContent = `${doneCount} / ${ids.length} topics`;
  document.getElementById('head-ref-text').textContent = currentPhaseLabel();
}

/* Works inside Claude.ai (window.storage, synced to your account) AND as a
   standalone static page e.g. on GitHub Pages (falls back to localStorage,
   saved in that browser only). */
const hasClaudeStorage = typeof window.storage !== 'undefined' && !!window.storage;

async function save(){
  try{
    if(hasClaudeStorage){
      await window.storage.set(STORAGE_KEY, JSON.stringify(progress), false);
    } else {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
      if(SYNC_ENABLED && syncCode){
        try{ await pushRemote(syncCode, progress); }
        catch(err){ console.error('remote sync failed, kept local copy', err); }
      }
    }
  }catch(err){ console.error('save failed', err); }
}

async function load(){
  loadSyncCode();
  try{
    if(hasClaudeStorage){
      const res = await window.storage.get(STORAGE_KEY, false);
      if(res && res.value){ progress = JSON.parse(res.value); }
      else { firstRun = true; }
    } else if(SYNC_ENABLED){
      if(!syncCode) promptForSyncCode(null);
      if(syncCode){
        try{
          const remote = await pullRemote(syncCode);
          if(remote){
            progress = remote;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
          } else {
            const raw = localStorage.getItem(STORAGE_KEY);
            if(raw){ progress = JSON.parse(raw); await pushRemote(syncCode, progress); }
            else { firstRun = true; }
          }
        }catch(err){
          console.error('sync unavailable, using local copy', err);
          const raw = localStorage.getItem(STORAGE_KEY);
          if(raw){ progress = JSON.parse(raw); } else { firstRun = true; }
        }
      } else {
        const raw = localStorage.getItem(STORAGE_KEY);
        if(raw){ progress = JSON.parse(raw); } else { firstRun = true; }
      }
    } else {
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){ progress = JSON.parse(raw); } else { firstRun = true; }
    }
  }catch(err){
    firstRun = true;
    progress = {};
  }
  if(firstRun){
    defaultDoneIds().forEach(id=> progress[id] = true);
    save();
  }
  updateStorageLabel();
  render();
}

function updateStorageLabel(){
  const el = document.getElementById('storage-mode');
  if(!el) return;
  if(hasClaudeStorage) el.textContent = 'synced · claude.ai';
  else if(SYNC_ENABLED && syncCode) el.textContent = 'synced · all devices';
  else if(SYNC_ENABLED) el.textContent = 'sync not linked';
  else el.textContent = 'saved · this browser';
}

document.getElementById('reset-btn').addEventListener('click', async ()=>{
  if(!confirm('Reset all progress to 0%? This cannot be undone.')) return;
  progress = {};
  defaultDoneIds().forEach(id=> progress[id] = true);
  Object.keys(openState).forEach(k=>delete openState[k]);
  await save();
  render();
});

document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.getAttribute('data-filter');
    render();
  });
});

if(SYNC_ENABLED && !hasClaudeStorage){
  const syncBtn = document.getElementById('sync-btn');
  syncBtn.style.display = 'inline-block';
  syncBtn.addEventListener('click', async ()=>{
    const changed = promptForSyncCode(syncCode);
    if(changed){
      try{
        const remote = await pullRemote(syncCode);
        if(remote){ progress = remote; }
        else { await pushRemote(syncCode, progress); }
      }catch(err){ console.error('sync switch failed', err); }
      updateStorageLabel();
      render();
    }
  });
}

load();
</script>
